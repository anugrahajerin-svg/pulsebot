name: Pulse Bot Automation

on:
  workflow_dispatch:

jobs:
  pulse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Pulse Bot
        run: python bot.py

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: pulse-report
          path: pulse_report.txt